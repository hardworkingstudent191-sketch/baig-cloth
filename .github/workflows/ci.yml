name: CI

# Frontend has no test suite, just tsc + vite build. Backend has a real
# pytest suite (backend/tests/) covering the security-critical paths, run
# here against a throwaway Postgres service container — plus migration
# checks that catch the overwhelming majority of "it broke on deploy" cases
# for a project this size (schema drift, an import-time crash).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build` — the only automated check
      # the frontend currently has.
      - run: npm run build
        env:
          VITE_SITE_URL: https://baigcloth.com
          # Placeholder: the production build refuses localhost/http API URLs.
          # CI never deploys this artifact; the path also exercises CSP generation
          # with a WordPress-style API URL.
          VITE_API_URL: https://cms.baigcloth.com/wp-json/baig/v1

  backend:
    name: Backend — migrations, tests & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real Postgres, not SQLite: Product.image_urls is a Postgres ARRAY
    # column, so create_all and the migrations only work on the real dialect.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baig_cloth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baig_cloth_ci
      # config.py fails fast on a placeholder or under-32-char secret by
      # design. CI-only value, unrelated to any real deployment.
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-real-0123456789
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements-dev.txt

      - name: Byte-compile every module
        run: python -m compileall -q app scripts

      - name: Apply migrations
        run: alembic upgrade head

      # Catches the failure mode CLAUDE.md warns about: editing app/models.py
      # and forgetting to generate the matching migration, so the deployed
      # schema silently drifts from the code.
      - name: Models match migrations
        run: alembic check

      - name: Import the app
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

      # tests/ exercises auth-required-on-every-write-route, forged-token
      # rejection, login rate limiting, price/sale validation, and the
      # sale-expiry logic — inside a per-test transaction rollback (see
      # tests/conftest.py), so nothing here persists in the CI database.
      - name: Run test suite
        run: pytest tests/ -v

      # Fails the build if any pinned production dependency has a published
      # fix for a known vulnerability. --no-deps: audit exactly what's in
      # requirements.txt, not the resolver's incidental extras.
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --no-deps
